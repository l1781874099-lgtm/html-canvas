<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>01 原生 JS · class 切换 + Canvas 图表</title>
<style>
body{margin:0;font-family:"Microsoft YaHei",sans-serif;background:#f4f6fb;color:#1f2533}
.wrap{max-width:1100px;margin:40px auto;background:#fff;border-radius:14px;box-shadow:0 6px 24px rgba(30,50,90,.08);padding:28px}
h1{font-size:22px;margin:0 0 18px}
.tabs{display:flex;gap:4px;border-bottom:1px solid #e5e8ef;margin-bottom:22px}
.tabs button{border:0;background:none;padding:10px 18px;font-size:15px;color:#6b7385;cursor:pointer;border-bottom:3px solid transparent}
.tabs button.active{color:#2f6bff;border-bottom-color:#2f6bff;font-weight:600}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:22px}
.card{background:#f7f9fe;border-radius:10px;padding:16px}.card b{display:block;font-size:26px;margin-top:6px;color:#2f6bff}
canvas{width:100%;height:260px;background:#fbfcff;border-radius:10px}
</style></head><body>
<div class="wrap">
  <h1>销售概览</h1>
  <div class="tabs" id="tabs"><button class="active" data-k="day">今日</button><button data-k="week">本周</button><button data-k="month">本月</button></div>
  <div class="cards" id="cards"></div>
  <canvas id="chart" width="1040" height="260"></canvas>
</div>
<script>
const data={
  day:{cards:[['订单数','1,204'],['销售额','¥86,320'],['客单价','¥71.7']],line:[12,18,9,22,30,26,34],color:'#2f6bff'},
  week:{cards:[['订单数','8,931'],['销售额','¥612,004'],['客单价','¥68.5']],line:[40,52,47,61,58,72,80],color:'#12b886'},
  month:{cards:[['订单数','36,118'],['销售额','¥2,480,915'],['客单价','¥68.7']],line:[120,98,140,160,150,190,210],color:'#f08c00'}
};
function draw(k){
  const d=data[k];
  document.getElementById('cards').innerHTML=d.cards.map(([t,v])=>'<div class="card">'+t+'<b>'+v+'</b></div>').join('');
  const c=document.getElementById('chart'),g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);
  const max=Math.max(...d.line),step=c.width/(d.line.length-1);
  g.strokeStyle=d.color;g.lineWidth=4;g.beginPath();
  d.line.forEach((v,i)=>{const x=i*step,y=c.height-20-(v/max)*(c.height-50);i?g.lineTo(x,y):g.moveTo(x,y)});g.stroke();
  g.fillStyle=d.color;g.font='bold 20px sans-serif';g.fillText(k.toUpperCase(),20,30);
}
document.getElementById('tabs').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('active',x===b));draw(b.dataset.k);
});
draw('day');
</script></body></html>
