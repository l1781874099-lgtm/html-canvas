<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>06 异步加载（先显示加载中，1.5 秒后出内容）· data-state + pointerdown</title>
<style>
body{margin:0;font-family:"Microsoft YaHei",sans-serif;background:#fff;color:#111}
.root{width:880px;margin:50px auto}
.list{display:flex;gap:24px;border-bottom:1px solid #eee}
.trigger{background:none;border:0;padding:12px 2px;font-size:15px;color:#888;cursor:pointer}
.trigger[data-state=active]{color:#111;box-shadow:inset 0 -2px 0 #111}
.content{padding:24px 0;min-height:200px}
.loading{color:#999}.spin{display:inline-block;width:14px;height:14px;border:2px solid #ccc;border-top-color:#333;border-radius:50%;animation:s 1s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes s{to{transform:rotate(360deg)}}
.item{padding:14px 16px;border:1px solid #eee;border-radius:10px;margin-bottom:10px}
</style></head><body>
<div class="root">
  <div class="list" id="list"></div>
  <div class="content" id="content"></div>
</div>
<script>
const tabs=['账户','安全','通知'];
const detail={账户:['用户名：demo','邮箱：demo@example.com','注册时间：2024-05-01'],安全:['两步验证：已开启','最近登录：上海','密码更新：30 天前'],通知:['邮件通知：开启','短信通知：关闭','站内信：开启']};
let active='账户';
function renderList(){document.getElementById('list').innerHTML=tabs.map(t=>'<button class="trigger" data-state="'+(t===active?'active':'inactive')+'" data-v="'+t+'">'+t+'</button>').join('')}
function load(t){
  const box=document.getElementById('content');box.innerHTML='<div class="loading"><span class="spin"></span>加载中…</div>';
  setTimeout(()=>{if(active!==t)return;box.innerHTML=detail[t].map(x=>'<div class="item">'+x+'</div>').join('')},1500);
}
// Radix-style: switches on pointerdown, not click.
document.getElementById('list').addEventListener('pointerdown',e=>{const b=e.target.closest('[data-v]');if(!b||b.dataset.v===active)return;active=b.dataset.v;renderList();load(active)});
renderList();load(active);
</script></body></html>
